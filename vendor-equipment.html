<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vendor Equipment - AgriTrack</title>

    <link rel="stylesheet"
          href="assets/css/style.css">

    <style>

        .vendor-equipment-container {
            max-width: 700px;
            margin: 30px auto;
            padding: 25px;
        }

        .vendor-equipment-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .vendor-equipment-card h2 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 25px;
        }

        .vendor-equipment-card label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .vendor-equipment-card input,
        .vendor-equipment-card select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .image-preview {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        .image-preview img {
            width: 220px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid #4caf50;
        }

        .vendor-equipment-card button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4caf50;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .vendor-equipment-card button:hover {
            background: #388e3c;
        }

        .equipment-success {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f1f8e9;
            border-left: 5px solid #4caf50;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<nav>

    <h2>AgriTrack</h2>

    <ul>

        <li>
            <a href="index.html">Home</a>
        </li>

        <li>
            <a href="dashboard.html">Dashboard</a>
        </li>

        <li>
            <a href="profile.html">Profile</a>
        </li>

        <li>
            <a href="crop.html">Crop</a>
        </li>

    </ul>

</nav>


<header>

    <h1>🚜 Vendor Equipment</h1>

    <p>
        Add your equipment for farmers
    </p>

</header>


<section class="vendor-equipment-container">

    <div class="vendor-equipment-card">

        <h2>
            🚜 Add Equipment
        </h2>


        <!-- Equipment Image -->

        <label>
            Equipment Image
        </label>

        <input
            type="file"
            id="equipmentImage"
            accept="image/*"
            onchange="previewEquipmentImage()">


        <!-- Image Preview -->

        <div
            class="image-preview"
            id="imagePreview">

            <img
                id="previewImage"
                src=""
                alt="Equipment Preview">

        </div>


        <!-- Equipment Type -->

        <label>
            Equipment Type
        </label>

        <select id="equipmentType">

            <option value="Tractor">
                🚜 Tractor
            </option>

            <option value="Rotavator">
                🌱 Rotavator
            </option>

            <option value="Cultivator">
                🌾 Cultivator
            </option>

            <option value="Harvester">
                🌾 Harvester
            </option>

            <option value="Other">
                🔧 Other Equipment
            </option>

        </select>


        <!-- Equipment Name -->

        <label>
            Equipment Name / Model
        </label>

        <input
            type="text"
            id="equipmentName"
            placeholder="Example: Mahindra 575 DI">


        <!-- Vendor Name -->

        <label>
            Vendor Name
        </label>

        <input
            type="text"
            id="vendorName"
            placeholder="Enter vendor name">


        <!-- Contact -->

        <label>
            Contact Number
        </label>

        <input
            type="tel"
            id="vendorContact"
            placeholder="Enter contact number">


        <!-- Price -->

        <label>
            Rental Price Per Day (₹)
        </label>

        <input
            type="number"
            id="equipmentPrice"
            placeholder="Example: 1500">


        <!-- Location -->

        <label>
            Location
        </label>

        <input
            type="text"
            id="equipmentLocation"
            placeholder="Example: Solapur">


        <!-- Availability -->

        <label>
            Availability
        </label>

        <select id="equipmentAvailability">

            <option value="Available">
                🟢 Available
            </option>

            <option value="Not Available">
                🔴 Not Available
            </option>

        </select>


        <!-- Save Button -->

        <button
            onclick="saveVendorEquipment()">

            💾 Add Equipment

        </button>


        <!-- Success Message -->

        <div
            class="equipment-success"
            id="equipmentSuccess">

            <strong>
                ✅ Equipment added successfully!
            </strong>

            <p>
                Your equipment listing has been saved.
            </p>

        </div>

    </div>

</section>


<footer>

    <p>
        © 2026 AgriTrack | Smart Farming Solution
    </p>

</footer>


<script src="assets/js/app.js"></script>


<script>

/* =========================================
   EQUIPMENT IMAGE PREVIEW
========================================= */

function previewEquipmentImage() {

    const imageInput =
        document.getElementById(
            "equipmentImage"
        );

    const preview =
        document.getElementById(
            "imagePreview"
        );

    const previewImage =
        document.getElementById(
            "previewImage"
        );


    if (
        imageInput.files &&
        imageInput.files[0]
    ) {

        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                previewImage.src =
                    event.target.result;

                preview.style.display =
                    "block";

            };


        reader.readAsDataURL(
            imageInput.files[0]
        );

    }

}


/* =========================================
   SAVE VENDOR EQUIPMENT
========================================= */

function saveVendorEquipment() {

    const equipmentImage =
        document.getElementById(
            "equipmentImage"
        );

    const equipmentType =
        document.getElementById(
            "equipmentType"
        ).value;

    const equipmentName =
        document.getElementById(
            "equipmentName"
        ).value.trim();

    const vendorName =
        document.getElementById(
            "vendorName"
        ).value.trim();

    const vendorContact =
        document.getElementById(
            "vendorContact"
        ).value.trim();

    const equipmentPrice =
        document.getElementById(
            "equipmentPrice"
        ).value;

    const equipmentLocation =
        document.getElementById(
            "equipmentLocation"
        ).value.trim();

    const equipmentAvailability =
        document.getElementById(
            "equipmentAvailability"
        ).value;


    /* Check required fields */

    if (
        !equipmentImage.files[0] ||
        equipmentName === "" ||
        vendorName === "" ||
        vendorContact === "" ||
        equipmentPrice === "" ||
        equipmentLocation === ""
    ) {

        alert(
            "Please fill all required details and select an equipment image."
        );

        return;

    }


    /* Read image */

    const reader =
        new FileReader();


    reader.onload =
        function(event) {

            const equipmentData = {

                equipmentImage:
                    event.target.result,

                equipmentType:
                    equipmentType,

                equipmentName:
                    equipmentName,

                vendorName:
                    vendorName,

                vendorContact:
                    vendorContact,

                equipmentPrice:
                    equipmentPrice,

                equipmentLocation:
                    equipmentLocation,

                equipmentAvailability:
                    equipmentAvailability

            };


            /* Save complete listing */

            localStorage.setItem(
                "vendorEquipment",
                JSON.stringify(
                    equipmentData
                )
            );


            /* Show success message */

            document.getElementById(
                "equipmentSuccess"
            ).style.display = "block";


            console.log(
                "Vendor Equipment Saved:",
                equipmentData
            );

        };


    reader.readAsDataURL(
        equipmentImage.files[0]
    );

}

</script>

</body>

</html>
